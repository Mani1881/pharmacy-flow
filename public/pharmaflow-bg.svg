<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Main background gradient: light blue to white -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
    <!-- Pill gradient: white with light blue sheen -->
    <linearGradient id="pillBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>
    <!-- Pill gradient: white with pink sheen -->
    <linearGradient id="pillPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <!-- Capsule blue half -->
    <linearGradient id="capsuleBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#81D4FA"/>
    </linearGradient>
    <!-- Capsule pink half -->
    <linearGradient id="capsulePink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
    <!-- Bottle gradient -->
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>
    <!-- Radial glow for decorative circles -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B3E5FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B3E5FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8BBD0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8BBD0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Soft decorative glow circles -->
  <circle cx="200" cy="200" r="300" fill="url(#glowBlue)"/>
  <circle cx="1720" cy="880" r="280" fill="url(#glowPink)"/>
  <circle cx="960" cy="540" r="400" fill="url(#glowBlue)" opacity="0.3"/>
  <circle cx="300" cy="900" r="200" fill="url(#glowPink)" opacity="0.4"/>
  <circle cx="1650" cy="150" r="220" fill="url(#glowBlue)" opacity="0.35"/>

  <!-- ===== MEDICINE BOTTLES ===== -->
  <!-- Bottle 1 (top-left area) -->
  <g transform="translate(120, 320) rotate(-15)">
    <!-- Body -->
    <rect x="0" y="30" width="60" height="90" rx="8" fill="url(#bottleGrad)" stroke="#B3E5FC" stroke-width="2"/>
    <!-- Neck -->
    <rect x="15" y="12" width="30" height="22" rx="4" fill="#E3F2FD" stroke="#B3E5FC" stroke-width="2"/>
    <!-- Cap -->
    <rect x="10" y="4" width="40" height="12" rx="6" fill="#81D4FA"/>
    <!-- Label -->
    <rect x="8" y="52" width="44" height="44" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <!-- Cross on label -->
    <rect x="25" y="58" width="10" height="32" rx="2" fill="#F48FB1"/>
    <rect x="13" y="70" width="34" height="10" rx="2" fill="#F48FB1"/>
  </g>

  <!-- Bottle 2 (bottom-right area) -->
  <g transform="translate(1720, 600) rotate(10)">
    <rect x="0" y="30" width="60" height="90" rx="8" fill="url(#bottleGrad)" stroke="#B3E5FC" stroke-width="2"/>
    <rect x="15" y="12" width="30" height="22" rx="4" fill="#E3F2FD" stroke="#B3E5FC" stroke-width="2"/>
    <rect x="10" y="4" width="40" height="12" rx="6" fill="#F8BBD0"/>
    <rect x="8" y="52" width="44" height="44" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="25" y="58" width="10" height="32" rx="2" fill="#81D4FA"/>
    <rect x="13" y="70" width="34" height="10" rx="2" fill="#81D4FA"/>
  </g>

  <!-- Bottle 3 (center-right) -->
  <g transform="translate(1550, 300) rotate(-8)">
    <rect x="0" y="30" width="55" height="85" rx="8" fill="#FCE4EC" stroke="#F8BBD0" stroke-width="2"/>
    <rect x="13" y="12" width="28" height="20" rx="4" fill="#FCE4EC" stroke="#F8BBD0" stroke-width="2"/>
    <rect x="9" y="4" width="36" height="12" rx="6" fill="#F48FB1"/>
    <rect x="7" y="48" width="40" height="40" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="22" y="54" width="9" height="28" rx="2" fill="#81D4FA"/>
    <rect x="11" y="64" width="30" height="9" rx="2" fill="#81D4FA"/>
  </g>

  <!-- ===== ROUND PILLS ===== -->
  <!-- Top area pills -->
  <ellipse cx="400" cy="80" rx="30" ry="18" fill="url(#pillBlue)" stroke="#B3E5FC" stroke-width="1.5" transform="rotate(-20, 400, 80)"/>
  <ellipse cx="500" cy="120" rx="26" ry="15" fill="url(#pillPink)" stroke="#F8BBD0" stroke-width="1.5" transform="rotate(15, 500, 120)"/>
  <ellipse cx="1450" cy="60" rx="28" ry="16" fill="url(#pillBlue)" stroke="#B3E5FC" stroke-width="1.5" transform="rotate(25, 1450, 60)"/>
  <ellipse cx="1550" cy="110" rx="24" ry="14" fill="url(#pillPink)" stroke="#F8BBD0" stroke-width="1.5" transform="rotate(-10, 1550, 110)"/>

  <!-- Left side pills -->
  <ellipse cx="60" cy="550" rx="28" ry="16" fill="url(#pillPink)" stroke="#F8BBD0" stroke-width="1.5" transform="rotate(30, 60, 550)"/>
  <ellipse cx="90" cy="650" rx="26" ry="15" fill="url(#pillBlue)" stroke="#B3E5FC" stroke-width="1.5" transform="rotate(-20, 90, 650)"/>

  <!-- Right side pills -->
  <ellipse cx="1860" cy="450" rx="28" ry="16" fill="url(#pillBlue)" stroke="#B3E5FC" stroke-width="1.5" transform="rotate(-30, 1860, 450)"/>
  <ellipse cx="1840" cy="550" rx="25" ry="14" fill="url(#pillPink)" stroke="#F8BBD0" stroke-width="1.5" transform="rotate(20, 1840, 550)"/>

  <!-- Bottom pills -->
  <ellipse cx="600" cy="980" rx="30" ry="18" fill="url(#pillBlue)" stroke="#B3E5FC" stroke-width="1.5" transform="rotate(-15, 600, 980)"/>
  <ellipse cx="750" cy="1020" rx="26" ry="15" fill="url(#pillPink)" stroke="#F8BBD0" stroke-width="1.5" transform="rotate(25, 750, 1020)"/>
  <ellipse cx="1200" cy="1000" rx="28" ry="16" fill="url(#pillBlue)" stroke="#B3E5FC" stroke-width="1.5" transform="rotate(-20, 1200, 1000)"/>
  <ellipse cx="1350" cy="1040" rx="24" ry="14" fill="url(#pillPink)" stroke="#F8BBD0" stroke-width="1.5" transform="rotate(15, 1350, 1040)"/>

  <!-- ===== CAPSULES (two-tone oval) ===== -->
  <!-- Capsule helper: clipPath to split oval in half -->
  <defs>
    <clipPath id="capLeftClip1"><rect x="0" y="0" width="30" height="22"/></clipPath>
    <clipPath id="capRightClip1"><rect x="30" y="0" width="30" height="22"/></clipPath>
    <clipPath id="capLeftClip2"><rect x="0" y="0" width="28" height="18"/></clipPath>
    <clipPath id="capRightClip2"><rect x="28" y="0" width="28" height="18"/></clipPath>
    <clipPath id="capLeftClip3"><rect x="0" y="0" width="32" height="20"/></clipPath>
    <clipPath id="capRightClip3"><rect x="32" y="0" width="32" height="20"/></clipPath>
  </defs>

  <!-- Capsule 1 (top-left) -->
  <g transform="translate(280, 150) rotate(-25)">
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capLeftClip1)" fill="#B3E5FC" stroke="#81D4FA" stroke-width="1.5"/>
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capRightClip1)" fill="#F8BBD0" stroke="#F48FB1" stroke-width="1.5"/>
  </g>

  <!-- Capsule 2 (top-right) -->
  <g transform="translate(1600, 200) rotate(20)">
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capLeftClip1)" fill="#F8BBD0" stroke="#F48FB1" stroke-width="1.5"/>
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capRightClip1)" fill="#B3E5FC" stroke="#81D4FA" stroke-width="1.5"/>
  </g>

  <!-- Capsule 3 (bottom-left) -->
  <g transform="translate(200, 820) rotate(15)">
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capLeftClip1)" fill="#B3E5FC" stroke="#81D4FA" stroke-width="1.5"/>
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capRightClip1)" fill="#FCE4EC" stroke="#F8BBD0" stroke-width="1.5"/>
  </g>

  <!-- Capsule 4 (bottom-right) -->
  <g transform="translate(1650, 850) rotate(-18)">
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capLeftClip1)" fill="#FCE4EC" stroke="#F8BBD0" stroke-width="1.5"/>
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capRightClip1)" fill="#81D4FA" stroke="#4FC3F7" stroke-width="1.5"/>
  </g>

  <!-- Capsule 5 (mid-left) -->
  <g transform="translate(50, 380) rotate(30)">
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capLeftClip1)" fill="#F8BBD0" stroke="#F48FB1" stroke-width="1.5"/>
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capRightClip1)" fill="#B3E5FC" stroke="#81D4FA" stroke-width="1.5"/>
  </g>

  <!-- Capsule 6 (mid-right) -->
  <g transform="translate(1840, 320) rotate(-25)">
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capLeftClip1)" fill="#B3E5FC" stroke="#81D4FA" stroke-width="1.5"/>
    <ellipse cx="30" cy="11" rx="30" ry="11" clip-path="url(#capRightClip1)" fill="#F8BBD0" stroke="#F48FB1" stroke-width="1.5"/>
  </g>

  <!-- ===== MEDICAL CROSS SYMBOLS ===== -->
  <!-- Large cross - top center -->
  <g transform="translate(880, 40)" opacity="0.15">
    <rect x="20" y="0" width="20" height="60" rx="4" fill="#81D4FA"/>
    <rect x="0" y="20" width="60" height="20" rx="4" fill="#81D4FA"/>
  </g>

  <!-- Medium cross - bottom left -->
  <g transform="translate(380, 920)" opacity="0.15">
    <rect x="15" y="0" width="15" height="45" rx="3" fill="#F48FB1"/>
    <rect x="0" y="15" width="45" height="15" rx="3" fill="#F48FB1"/>
  </g>

  <!-- Medium cross - top right -->
  <g transform="translate(1480, 100)" opacity="0.15">
    <rect x="15" y="0" width="15" height="45" rx="3" fill="#81D4FA"/>
    <rect x="0" y="15" width="45" height="15" rx="3" fill="#81D4FA"/>
  </g>

  <!-- Small cross - mid area left -->
  <g transform="translate(150, 700)" opacity="0.18">
    <rect x="10" y="0" width="10" height="30" rx="2" fill="#F48FB1"/>
    <rect x="0" y="10" width="30" height="10" rx="2" fill="#F48FB1"/>
  </g>

  <!-- Small cross - mid area right -->
  <g transform="translate(1770, 500)" opacity="0.18">
    <rect x="10" y="0" width="10" height="30" rx="2" fill="#81D4FA"/>
    <rect x="0" y="10" width="30" height="10" rx="2" fill="#81D4FA"/>
  </g>

  <!-- Small cross - bottom right -->
  <g transform="translate(1500, 960)" opacity="0.15">
    <rect x="10" y="0" width="10" height="30" rx="2" fill="#F48FB1"/>
    <rect x="0" y="10" width="30" height="10" rx="2" fill="#F48FB1"/>
  </g>

  <!-- ===== SCATTERED SMALL DOTS (pill accent) ===== -->
  <circle cx="720" cy="90" r="8" fill="#B3E5FC" opacity="0.6"/>
  <circle cx="760" cy="60" r="5" fill="#F8BBD0" opacity="0.6"/>
  <circle cx="1100" cy="80" r="7" fill="#B3E5FC" opacity="0.5"/>
  <circle cx="1140" cy="50" r="5" fill="#F8BBD0" opacity="0.6"/>
  <circle cx="300" cy="480" r="7" fill="#F8BBD0" opacity="0.5"/>
  <circle cx="320" cy="510" r="4" fill="#B3E5FC" opacity="0.6"/>
  <circle cx="1620" cy="480" r="7" fill="#B3E5FC" opacity="0.5"/>
  <circle cx="1650" cy="510" r="5" fill="#F8BBD0" opacity="0.6"/>
  <circle cx="860" cy="950" r="8" fill="#B3E5FC" opacity="0.5"/>
  <circle cx="900" cy="980" r="5" fill="#F8BBD0" opacity="0.6"/>
  <circle cx="1050" cy="960" r="6" fill="#F8BBD0" opacity="0.5"/>

  <!-- ===== SUBTLE WAVE PATTERN (bottom) ===== -->
  <path d="M0 1020 Q240 980 480 1020 Q720 1060 960 1020 Q1200 980 1440 1020 Q1680 1060 1920 1020 L1920 1080 L0 1080 Z" fill="#E3F2FD" opacity="0.3"/>
  <path d="M0 1040 Q240 1000 480 1040 Q720 1080 960 1040 Q1200 1000 1440 1040 Q1680 1080 1920 1040 L1920 1080 L0 1080 Z" fill="#FCE4EC" opacity="0.2"/>

  <!-- ===== SUBTLE WAVE PATTERN (top) ===== -->
  <path d="M0 60 Q240 100 480 60 Q720 20 960 60 Q1200 100 1440 60 Q1680 20 1920 60 L1920 0 L0 0 Z" fill="#E3F2FD" opacity="0.3"/>
</svg>
